version: "3.8"

services:
  nuxt:
    build: .
    container_name: nuxt
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_PUBLIC_STRAPI_URL: ${NUXT_PUBLIC_STRAPI_URL}
      STRAPI_TOKEN: ${STRAPI_TOKEN}
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - giro_network

networks:
  giro_network:
    external: true